<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Portfolio</title>

    <base href="/" />

    <!--
        GitHub Pages SPA fallback.

        If GitHub Pages redirects a client-side route through
        ?p=/projects, restore the original route before Blazor starts.
    -->
    <script>
        (function () {
            var query = new URLSearchParams(window.location.search);
            var path = query.get('p');

            if (!path) {
                return;
            }

            var remainingParams = new URLSearchParams(window.location.search);
            remainingParams.delete('p');

            var queryString = remainingParams.toString();

            var cleanUrl = path;

            if (queryString) {
                cleanUrl += '?' + queryString;
            }

            if (window.location.hash) {
                cleanUrl += window.location.hash;
            }

            window.history.replaceState(null, '', cleanUrl);
        })();
    </script>

    <link rel="stylesheet" href="css/app.css" />

</head>

<body>

    <div id="app">
        Loading...
    </div>

    <!--<div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>-->

    <script>
        window.blazorCulture = {
            get: () => window.localStorage['BlazorCulture'],
            set: (value) => window.localStorage['BlazorCulture'] = value
        };

        window.theme = {
            get: () => window.localStorage['theme'] || 'dark',
            set: (value) => window.localStorage['theme'] = value
        };

        window.setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
        };

        function setPageTitle(value) {
            document.title = value;
        }
    </script>

    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
